[project]
name = "flask-rag"
version = "0.1.0"
description = "Flask RAG application using MongoDB Atlas Vector Search and Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "pymongo>=4.6",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "langchain-text-splitters>=0.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]
