[project]
name = "advance-rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KarmegamJ", email = "karmegamwithai@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.8.0",
    "flask>=3.1.3",
    "google-genai>=2.31.0",
    "ipykernel>=7.3.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "langchain-mongodb>=0.11.0",
    "langchain-text-splitters>=1.1.3",
    "pymongo>=4.18.3",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
advance-rag-project = "advance_rag_project:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
